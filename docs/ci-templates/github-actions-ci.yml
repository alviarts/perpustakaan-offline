name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Tk + system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-tk

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install bcrypt python-barcode reportlab openpyxl matplotlib Pillow ruff pytest

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Pytest
        run: pytest tests/ -q

  build-windows:
    name: Build .exe (Windows)
    needs: lint-test
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller build.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: perpustakaan-offline-windows
          path: dist/PerpustakaanOffline.exe
          if-no-files-found: error
          retention-days: 30
