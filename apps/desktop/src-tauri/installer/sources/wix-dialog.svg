<?xml version="1.0" encoding="UTF-8"?>
<!--
  WiX dialog background — 493 × 312 (wide rectangle, ratio ~1.58).
  Two-column layout: brand mark on the left third (circular medallion so
  it cannot be stretched), wordmark + tagline + version stack on the
  right two thirds. Decorative page rules in the lower right echo the
  book motif.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 493 312"
     width="493" height="312"
     preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0b1e3f"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fefefe"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="493" height="312" fill="url(#bg)"/>

  <!-- Brand medallion (left third). Circle keeps the mark from being
       stretched even if the whole image gets resampled. -->
  <g transform="translate(126 156)">
    <circle r="92" fill="#0b1e3f" opacity="0.55"/>

    <!-- Sun / Garuda mark -->
    <g transform="translate(0 -42)">
      <g fill="url(#sun)">
        <rect x="-3"  y="-32" width="6" height="14" rx="2"/>
        <rect x="-3"  y="18"  width="6" height="14" rx="2"/>
        <rect x="-32" y="-3"  width="14" height="6" rx="2"/>
        <rect x="18"  y="-3"  width="14" height="6" rx="2"/>
        <rect x="-22" y="-22" width="14" height="6" rx="2" transform="rotate(45)"/>
        <rect x="-22" y="16"  width="14" height="6" rx="2" transform="rotate(45)"/>
        <rect x="8"   y="-22" width="14" height="6" rx="2" transform="rotate(45)"/>
        <rect x="8"   y="16"  width="14" height="6" rx="2" transform="rotate(45)"/>
      </g>
      <circle r="14" fill="url(#sun)"/>
    </g>

    <!-- Open book -->
    <g transform="translate(0 30)">
      <path d="M -64 -10 Q -28 -20 -2 -6 L -2 44 Q -28 30 -64 38 Z"
            fill="url(#page)" stroke="#cbd5e1" stroke-width="1"/>
      <path d="M  64 -10 Q  28 -20  2 -6 L  2 44 Q  28 30  64 38 Z"
            fill="url(#page)" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="-2" y="-8" width="4" height="52" rx="1.2" fill="#94a3b8"/>
      <g fill="#475569" opacity="0.55">
        <rect x="-56" y="2"  width="44" height="3" rx="1.5"/>
        <rect x="-56" y="10" width="40" height="3" rx="1.5"/>
        <rect x="-56" y="18" width="44" height="3" rx="1.5"/>
        <rect x="-56" y="26" width="36" height="3" rx="1.5"/>
        <rect x="12"  y="2"  width="44" height="3" rx="1.5"/>
        <rect x="12"  y="10" width="40" height="3" rx="1.5"/>
        <rect x="12"  y="18" width="44" height="3" rx="1.5"/>
        <rect x="12"  y="26" width="38" height="3" rx="1.5"/>
      </g>
    </g>
  </g>

  <!-- Right column: wordmark stack -->
  <text x="244" y="118"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="34" font-weight="700"
        fill="#ffffff" letter-spacing="0.5">Perpustakaan</text>
  <text x="244" y="156"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="34" font-weight="500"
        fill="#cbd5e1" letter-spacing="0.5">Offline</text>

  <line x1="244" y1="178" x2="436" y2="178"
        stroke="#fbbf24" stroke-width="1.5" opacity="0.85"/>

  <text x="244" y="200"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="13" font-weight="500"
        fill="#cbd5e1" letter-spacing="0.5">Sistem manajemen perpustakaan</text>
  <text x="244" y="218"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="13" font-weight="500"
        fill="#cbd5e1" letter-spacing="0.5">offline-first untuk sekolah &amp; kampus</text>

  <!-- Version pill -->
  <rect x="244" y="246" width="58" height="22" rx="11"
        fill="url(#sun)" opacity="0.95"/>
  <text x="273" y="262"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="12" font-weight="700"
        text-anchor="middle"
        fill="#0b1e3f" letter-spacing="1.5">VERSI 2</text>

  <!-- Footer credit -->
  <text x="244" y="292"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="10" font-weight="400"
        fill="#94a3b8" letter-spacing="0.4">© alvi arts · vwrks · MIT licensed</text>
</svg>
