<?xml version="1.0" encoding="UTF-8"?>
<!--
  NSIS in-progress header — 150 × 57 (very small, wide).
  Tiny canvas, so the design is icon-on-left + 2-line wordmark on the right.
  Avoids fine page-line detail at this size; the book glyph is simplified.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 150 57"
     width="150" height="57"
     preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0b1e3f"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fefefe"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <rect width="150" height="57" fill="url(#bg)"/>

  <!-- Mark on the left, vertically centred -->
  <g transform="translate(28 28.5)">
    <!-- soft halo -->
    <circle r="20" fill="#1d4ed8" opacity="0.55"/>
    <!-- simplified open book -->
    <path d="M -16 -2 Q -7 -7 -1 -3 L -1 9 Q -7 5 -16 8 Z"
          fill="url(#page)" stroke="#cbd5e1" stroke-width="0.5"/>
    <path d="M  16 -2 Q  7 -7  1 -3 L  1 9 Q  7 5  16 8 Z"
          fill="url(#page)" stroke="#cbd5e1" stroke-width="0.5"/>
    <rect x="-1" y="-3" width="2" height="12" rx="0.5" fill="#94a3b8"/>
    <!-- sun mark above the book -->
    <circle cy="-10" r="3.5" fill="#fbbf24"/>
  </g>

  <!-- Wordmark -->
  <text x="58" y="28"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="13" font-weight="700"
        fill="#ffffff" letter-spacing="0.3">Perpustakaan</text>
  <text x="58" y="44"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="11" font-weight="500"
        fill="#cbd5e1" letter-spacing="0.3">Offline · v2</text>
</svg>
