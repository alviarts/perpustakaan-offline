<?xml version="1.0" encoding="UTF-8"?>
<!--
  WiX top banner — 493 × 58 (extreme landscape, ratio ~8.5:1).
  This is where stretching a square logo broke worst. Designed natively
  with the mark in a fixed circle on the left, the wordmark filling the
  middle band, and a subtle rays motif on the right so the empty wide
  area does not look bald.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 493 58"
     width="493" height="58"
     preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#0b1e3f"/>
      <stop offset="35%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0b1e3f"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fefefe"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="493" height="58" fill="url(#bg)"/>

  <!-- Mark on the left, contained in a fixed circle so it never stretches -->
  <g transform="translate(34 29)">
    <circle r="22" fill="#0b1e3f" opacity="0.5"/>
    <path d="M -16 -2 Q -7 -7 -1 -3 L -1 9 Q -7 5 -16 8 Z"
          fill="url(#page)" stroke="#cbd5e1" stroke-width="0.5"/>
    <path d="M  16 -2 Q  7 -7  1 -3 L  1 9 Q  7 5  16 8 Z"
          fill="url(#page)" stroke="#cbd5e1" stroke-width="0.5"/>
    <rect x="-1" y="-3" width="2" height="12" rx="0.5" fill="#94a3b8"/>
    <circle cy="-11" r="4" fill="url(#sun)"/>
  </g>

  <!-- Wordmark in the centre band -->
  <text x="76" y="26"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="18" font-weight="700"
        fill="#ffffff" letter-spacing="0.5">Perpustakaan Offline</text>
  <text x="76" y="44"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="11" font-weight="400"
        fill="#cbd5e1" letter-spacing="0.5">Sistem manajemen perpustakaan offline-first</text>

  <!-- Decorative rays / mini-mark on the right so the wide empty area
       has rhythm. Each ray is fixed-size, no scaling. -->
  <g transform="translate(458 29)" fill="url(#sun)" opacity="0.85">
    <circle r="6"/>
    <rect x="-1.5" y="-14" width="3" height="6" rx="1"/>
    <rect x="-1.5" y="8"   width="3" height="6" rx="1"/>
    <rect x="-14"  y="-1.5" width="6" height="3" rx="1"/>
    <rect x="8"    y="-1.5" width="6" height="3" rx="1"/>
    <rect x="-10"  y="-10" width="6" height="3" rx="1" transform="rotate(45)"/>
    <rect x="-10"  y="6"   width="6" height="3" rx="1" transform="rotate(45)"/>
    <rect x="4"    y="-10" width="6" height="3" rx="1" transform="rotate(45)"/>
    <rect x="4"    y="6"   width="6" height="3" rx="1" transform="rotate(45)"/>
  </g>
</svg>
