[package]
name = "perpustakaan-desktop"
version = "1.2.0"
description = "Perpustakaan Nusantara v2 desktop (Tauri 2)"
authors = ["alvi arts"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "perpustakaan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-shell = "2.2"
tauri-plugin-sql = { version = "2.2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bcrypt = "0.16"
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "5"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.10"
base64 = "0.22"
opener = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
# FEAT-24 — encrypted backup
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
# FEAT-26 Google Sheets bidirectional sync (PR G v1.0.8). reqwest does the
# HTTPS calls to https://sheets.googleapis.com (rustls-tls keeps us off the
# system OpenSSL); jsonwebtoken signs the Service Account RS256 JWT used to
# exchange for an OAuth2 access token.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
tokio = { version = "1", features = ["sync"] }
# FEAT-20 — Bulk import buku via ISBN. ureq provides a small synchronous HTTP
# client used by the backend to call Open Library + Google Books from inside a
# blocking Tauri command without dragging tokio into the request path.
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
