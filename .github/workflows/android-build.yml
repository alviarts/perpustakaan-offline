name: Android APK Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-build.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/**/*.gradle*', 'apps/mobile/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Setup Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1
        # Generates gradlew + gradle-wrapper.jar if not committed

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon
        if: startsWith(github.ref, 'refs/tags/v')

      # Sign release APK if keystore secret is available
      - name: Sign release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          SIGNED_APK="${UNSIGNED_APK%.apk}-signed.apk"
          ALIGNED_APK="${UNSIGNED_APK%.apk}-aligned.apk"
          
          # Align
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)/zipalign \
            -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          
          # Sign
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          
          # Clean up
          rm /tmp/release.keystore
          
          # Rename for upload
          cp "$SIGNED_APK" app/build/outputs/apk/release/PerpustakaanNusantara-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: perpustakaan-android-debug
          path: apps/mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: perpustakaan-android-release
          path: apps/mobile/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

  # Attach APK to GitHub Release when tag is pushed
  release-android:
    name: Attach APK to GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-android-apk]
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: perpustakaan-android-release
          path: artifacts/android

      - name: List APK artifacts
        run: ls -laR artifacts/android/

      - name: Attach APK to existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/android/*.apk
