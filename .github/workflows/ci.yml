name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # Run CI on PRs to any branch (mendukung stacked PR / feature branches).

jobs:
  lint-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Tk + system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-tk

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install bcrypt python-barcode reportlab openpyxl matplotlib Pillow ruff pytest

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Pytest
        run: pytest tests/ -q

  smoke-test:
    name: Smoke Test GUI (Xvfb)
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Tk + Xvfb + ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-tk xvfb imagemagick

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-timeout

      - name: Run smoke tests on Xvfb
        run: |
          export XDG_DATA_HOME=$(mktemp -d)
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            python -m pytest tests/test_smoke_gui.py -v --timeout=120

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots
          path: docs/smoke-test/*.png
          if-no-files-found: ignore
          retention-days: 14

  build-linux:
    name: Build Linux binary
    needs: lint-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps (Tk + build tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-tk

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Linux binary (PyInstaller --onefile)
        run: pyinstaller build.spec --noconfirm

      - name: Rename artifact
        run: mv dist/PerpustakaanOffline dist/PerpustakaanOffline-linux

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: perpustakaan-offline-linux
          path: dist/PerpustakaanOffline-linux
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build .exe + Installer (Windows)
    needs: lint-test
    runs-on: windows-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build portable .exe (PyInstaller)
        run: pyinstaller build.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer (Inno Setup)
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss'

      - name: Upload portable .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: perpustakaan-offline-windows
          path: dist/PerpustakaanOffline.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: perpustakaan-offline-installer
          path: installer/Output/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download portable .exe
        uses: actions/download-artifact@v4
        with:
          name: perpustakaan-offline-windows
          path: artifacts/portable

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: perpustakaan-offline-installer
          path: artifacts/installer

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: perpustakaan-offline-linux
          path: artifacts/linux

      - name: List artifacts
        run: |
          ls -la artifacts/portable/
          ls -la artifacts/installer/
          ls -la artifacts/linux/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            artifacts/portable/PerpustakaanOffline.exe
            artifacts/installer/*.exe
            artifacts/linux/PerpustakaanOffline-linux
